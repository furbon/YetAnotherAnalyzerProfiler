name: CI

on:
  push:
    branches: [main, "develop/**", "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: "8.0"
            framework: net8.0
          - sdk: "10.0"
            framework: net10.0
    container: mcr.microsoft.com/dotnet/sdk:${{ matrix.sdk }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify
        shell: sh
        run: sh ./eng/build.sh verify --framework "${{ matrix.framework }}"

  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        framework: [net8.0, net10.0]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Verify including WPF
        shell: pwsh
        run: ./eng/build.ps1 verify --framework "${{ matrix.framework }}"

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Verify CLI
        shell: sh
        run: sh ./eng/build.sh verify --framework net10.0

  publish:
    needs: [linux, windows, macos]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runtime: linux-x64
          - os: windows-latest
            runtime: win-x64
          - os: macos-latest
            runtime: osx-x64
          - os: macos-latest
            runtime: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish self-contained single files
        shell: pwsh
        run: ./eng/build.ps1 publish --framework net10.0 --runtime "${{ matrix.runtime }}"
      - uses: actions/upload-artifact@v4
        with:
          name: yaap-${{ matrix.runtime }}
          path: artifacts/publish/${{ matrix.runtime }}/net10.0
          if-no-files-found: error
