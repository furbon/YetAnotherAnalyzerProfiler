name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag matching eng/Version.props (for example, v0.1.0)
        required: true
        type: string
      confirm_publish:
        description: Publish this version to NuGet and GitHub Releases
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  RepositoryUrl: ${{ github.server_url }}/${{ github.repository }}
  ReleaseTag: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  gate:
    name: Validate release request
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Validate trigger, version, source commit, and tag state
        env:
          ConfirmPublish: ${{ inputs.confirm_publish }}
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            if ($env:GITHUB_REF -cne 'refs/heads/main') {
              throw 'Manual releases must run from the main branch.'
            }
            if ($env:ConfirmPublish -cne 'true') {
              throw 'Manual release publication was not explicitly confirmed.'
            }
          } elseif ($env:GITHUB_REF_TYPE -cne 'tag') {
            throw 'Automatic releases must be triggered by a version tag.'
          }

          if ($env:ReleaseTag -cnotmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$') {
            throw "Release tag is not a supported SemVer tag: $env:ReleaseTag"
          }

          ./eng/validate-release.ps1 -Tag $env:ReleaseTag
          git fetch --no-tags origin main
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
            throw 'The release commit must be reachable from main.'
          }

          $existingTag = git tag --list -- "$env:ReleaseTag"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to inspect release tag $env:ReleaseTag."
          }
          if (-not [string]::IsNullOrWhiteSpace($existingTag)) {
            $existingCommit = git rev-parse "$env:ReleaseTag^{commit}"
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to resolve release tag $env:ReleaseTag."
            }
            if ($existingCommit -cne $env:GITHUB_SHA) {
              throw "Release tag $env:ReleaseTag already points to a different commit."
            }
          }

  validate:
    needs: gate
    name: Verify ${{ matrix.os }} / ${{ matrix.framework }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      attestations: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            sdk: "8.0.423"
            framework: net8.0
          - os: ubuntu-24.04
            sdk: "10.0.302"
            framework: net10.0
            package: true
          - os: windows-2025
            sdk: "8.0.423"
            framework: net8.0
          - os: windows-2025
            sdk: "10.0.302"
            framework: net10.0
          - os: macos-15
            sdk: "10.0.302"
            framework: net10.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Enable repository guards
        shell: pwsh
        run: ./eng/install-git-hooks.ps1
      - name: Isolate .NET SDK installation
        shell: pwsh
        run: '"DOTNET_INSTALL_DIR={0}" -f (Join-Path $env:RUNNER_TEMP "dotnet") | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ matrix.sdk }}
      - name: Verify tag matches the canonical version
        shell: pwsh
        run: ./eng/validate-release.ps1 -Tag $env:ReleaseTag
      - name: Verify
        shell: pwsh
        run: ./eng/build.ps1 verify --framework "${{ matrix.framework }}"
      - name: Preserve validated NuGet tool package
        if: matrix.package == true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nuget-package
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
          retention-days: 7
      - name: Attest the package at its producer
        if: matrix.package == true
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: artifacts/packages/*.nupkg

  binaries:
    needs: gate
    name: Publish ${{ matrix.runtime }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            runtime: linux-x64
          - os: windows-2025
            runtime: win-x64
          - os: macos-15
            runtime: osx-arm64
          - os: macos-15-intel
            runtime: osx-x64
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Enable repository guards
        shell: pwsh
        run: ./eng/install-git-hooks.ps1
      - name: Isolate .NET SDK installation
        shell: pwsh
        run: '"DOTNET_INSTALL_DIR={0}" -f (Join-Path $env:RUNNER_TEMP "dotnet") | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.302
      - name: Verify tag matches the canonical version
        shell: pwsh
        run: ./eng/validate-release.ps1 -Tag $env:ReleaseTag
      - name: Publish self-contained single files
        shell: pwsh
        run: ./eng/build.ps1 publish --framework net10.0 --runtime "${{ matrix.runtime }}"
      - name: Archive distribution
        shell: pwsh
        run: Compress-Archive -Path "artifacts/publish/${{ matrix.runtime }}/net10.0/*" -DestinationPath "artifacts/yaap-${{ matrix.runtime }}.zip"
      - name: Verify documented archive layout
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath "artifacts/yaap-${{ matrix.runtime }}.zip" -DestinationPath artifacts/archive-smoke
          if ('${{ matrix.runtime }}' -eq 'win-x64') {
            & artifacts/archive-smoke/cli/yaap.exe version
            if (-not (Test-Path artifacts/archive-smoke/gui/yaap-gui.exe)) { throw 'GUI executable is missing.' }
          } else {
            chmod +x artifacts/archive-smoke/cli/yaap
            & artifacts/archive-smoke/cli/yaap version
          }
      - name: Attest the archive at its producer
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: artifacts/yaap-${{ matrix.runtime }}.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binary-${{ matrix.runtime }}
          path: artifacts/yaap-${{ matrix.runtime }}.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish NuGet and GitHub release
    needs: [gate, validate, binaries]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Isolate .NET SDK installation
        shell: pwsh
        run: '"DOTNET_INSTALL_DIR={0}" -f (Join-Path $env:RUNNER_TEMP "dotnet") | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.302
      - name: Verify tag matches the canonical version
        shell: pwsh
        run: ./eng/validate-release.ps1 -Tag $env:ReleaseTag
      - name: Create or verify the immutable release tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $existingCommit = git rev-parse -q --verify "refs/tags/$env:ReleaseTag^{commit}" 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($existingCommit -cne $env:GITHUB_SHA) {
              throw "Release tag $env:ReleaseTag already points to a different commit."
            }
            exit 0
          }

          gh api --method POST "repos/$env:GITHUB_REPOSITORY/git/refs" `
            -f ref="refs/tags/$env:ReleaseTag" `
            -f sha="$env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) {
            git fetch --no-tags origin "refs/tags/$env:ReleaseTag:refs/tags/$env:ReleaseTag"
            $existingCommit = git rev-parse -q --verify "refs/tags/$env:ReleaseTag^{commit}" 2>$null
            if ($LASTEXITCODE -ne 0 -or $existingCommit -cne $env:GITHUB_SHA) {
              throw "Failed to create or verify release tag $env:ReleaseTag."
            }
          }
      - name: Download validated artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/release | Out-Null
          gh run download $env:GITHUB_RUN_ID --name nuget-package --dir artifacts/release
          gh run download $env:GITHUB_RUN_ID --pattern "binary-*" --dir artifacts/release
      - name: Create SHA-256 checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem artifacts/release -Recurse -File |
            Where-Object { $_.Extension -in '.zip', '.nupkg' } |
            Sort-Object Name
          $lines = $files | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $lines | Set-Content -LiteralPath artifacts/release/SHA256SUMS.txt -Encoding utf8NoBOM
      - name: Reject an existing public release and prepare the draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $releaseNotes = ".github/release-notes/$env:ReleaseTag.md"
          if (-not (Test-Path -LiteralPath $releaseNotes -PathType Leaf)) {
            throw "GitHub Release notes were not found: $releaseNotes"
          }
          $release = gh release view $env:ReleaseTag --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (-not (($release | ConvertFrom-Json).isDraft)) {
              throw "Release $env:ReleaseTag is already public; refusing to mutate it."
            }
            gh release edit $env:ReleaseTag --notes-file $releaseNotes
            if ($LASTEXITCODE -ne 0) { throw "Failed to update draft release notes for $env:ReleaseTag." }
          } else {
            gh release create $env:ReleaseTag --draft --verify-tag --notes-file $releaseNotes --title "YAAP $env:ReleaseTag"
            if ($LASTEXITCODE -ne 0) { throw "Failed to create draft release $env:ReleaseTag." }
          }
      - name: Verify any existing NuGet package is identical
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem artifacts/release -Recurse -Filter 'YetAnotherAnalyzerProfiler.Tool.*.nupkg' -File)
          if ($packages.Count -ne 1) { throw "Expected exactly one NuGet package; found $($packages.Count)." }
          $package = $packages[0]
          $version = $env:ReleaseTag.TrimStart('v')
          $uri = "https://api.nuget.org/v3-flatcontainer/yetanotheranalyzerprofiler.tool/$version/yetanotheranalyzerprofiler.tool.$version.nupkg"
          try {
            Invoke-WebRequest -Uri $uri -OutFile artifacts/release/existing.nupkg -ErrorAction Stop
            $local = (Get-FileHash -LiteralPath $package.FullName -Algorithm SHA256).Hash
            $published = (Get-FileHash -LiteralPath artifacts/release/existing.nupkg -Algorithm SHA256).Hash
            if ($local -ne $published) { throw "NuGet already contains $version with a different SHA-256 digest." }
            "YAAP_NUGET_EXISTS=true" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } catch {
            $response = $_.Exception.Response
            if ($null -eq $response -or [int]$response.StatusCode -ne 404) { throw }
          } finally {
            Remove-Item artifacts/release/existing.nupkg -ErrorAction SilentlyContinue
          }
      - name: Attest release artifacts
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: |
            artifacts/release/**/*.zip
            artifacts/release/**/*.nupkg
            artifacts/release/SHA256SUMS.txt
      - name: Authenticate to NuGet with a short-lived credential
        if: env.YAAP_NUGET_EXISTS != 'true'
        id: nuget-login
        uses: NuGet/login@ebc737b6fc418a6ca0073cf116ec8dc156d8b81e # v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish NuGet tool after digest validation
        if: env.YAAP_NUGET_EXISTS != 'true'
        shell: pwsh
        run: dotnet nuget push "artifacts/release/YetAnotherAnalyzerProfiler.Tool.*.nupkg" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: Verify the published NuGet digest
        shell: pwsh
        run: |
          $package = @(Get-ChildItem artifacts/release -Recurse -Filter 'YetAnotherAnalyzerProfiler.Tool.*.nupkg' -File)[0]
          $version = $env:ReleaseTag.TrimStart('v')
          $uri = "https://api.nuget.org/v3-flatcontainer/yetanotheranalyzerprofiler.tool/$version/yetanotheranalyzerprofiler.tool.$version.nupkg"
          for ($attempt = 1; $attempt -le 12; $attempt++) {
            try { Invoke-WebRequest -Uri $uri -OutFile artifacts/release/published.nupkg -ErrorAction Stop; break }
            catch { if ($attempt -eq 12) { throw }; Start-Sleep -Seconds 10 }
          }
          $local = (Get-FileHash -LiteralPath $package.FullName -Algorithm SHA256).Hash
          $published = (Get-FileHash -LiteralPath artifacts/release/published.nupkg -Algorithm SHA256).Hash
          Remove-Item artifacts/release/published.nupkg
          if ($local -ne $published) { throw "Published NuGet digest differs from the validated package." }
      - name: Publish GitHub release with binaries
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $assets = Get-ChildItem artifacts/release -Recurse -File |
            Where-Object { $_.Extension -in '.zip', '.nupkg', '.txt' } |
            ForEach-Object FullName
          $expected = @{}
          foreach ($asset in $assets) {
            $name = Split-Path -Leaf $asset
            if ($expected.ContainsKey($name)) { throw "Duplicate validated asset name: $name" }
            $file = Get-Item -LiteralPath $asset
            $expected[$name] = [pscustomobject]@{
              Size = $file.Length
              Digest = "sha256:$((Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant())"
            }
          }
          gh release upload $env:ReleaseTag $assets --clobber
          if ($LASTEXITCODE -ne 0) { throw "Failed to upload one or more validated release assets." }
          $releaseJson = gh release view $env:ReleaseTag --json assets
          if ($LASTEXITCODE -ne 0) { throw "Failed to read back draft release assets." }
          $release = $releaseJson | ConvertFrom-Json
          $expectedNames = @($expected.Keys | Sort-Object)
          $actualNames = @($release.assets | ForEach-Object name | Sort-Object)
          $difference = Compare-Object -ReferenceObject $expectedNames -DifferenceObject $actualNames
          if ($null -ne $difference) {
            throw "Draft release asset set differs from the validated allowlist: $($difference | Out-String)"
          }
          foreach ($asset in $release.assets) {
            $validated = $expected[$asset.name]
            if ([long]$asset.size -ne [long]$validated.Size) {
              throw "Draft asset size differs from validated asset: $($asset.name)"
            }
            if ([string]::IsNullOrWhiteSpace($asset.digest) -or
                -not $asset.digest.Equals($validated.Digest, [StringComparison]::OrdinalIgnoreCase)) {
              throw "Draft asset digest differs from validated asset: $($asset.name)"
            }
          }
          gh release edit $env:ReleaseTag --notes-file ".github/release-notes/$env:ReleaseTag.md" --draft=false
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish release $env:ReleaseTag." }
