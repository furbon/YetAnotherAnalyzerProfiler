name: Question or usage help
description: Ask about configuration, metrics, or operation
title: "[Question]: "
labels: [question]
body:
  - type: markdown
    attributes:
      value: |
        Questions may be written in English or Japanese. 英語または日本語で投稿できます。
        Remove confidential information, absolute paths, and unpublished code. Report vulnerabilities through SECURITY.md.
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: Briefly describe the target and the result you want.
    validations:
      required: true
  - type: textarea
    id: attempted
    attributes:
      label: What have you tried?
      description: Include commands, GUI actions, and documentation already consulted.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: YAAP version, OS, and .NET SDK
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Include diagnostic codes and the minimum required log content.
