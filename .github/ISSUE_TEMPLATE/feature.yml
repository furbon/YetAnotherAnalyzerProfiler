name: Feature request
description: Propose an improvement to YAAP behavior or usability
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Reports may be written in English or Japanese. 英語または日本語で投稿できます。
        Focus on the user problem. Report vulnerabilities and secrets through SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the affected users, situation, and desired outcome.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the desired CLI, GUI, output, or workflow behavior.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include current workarounds and alternatives you did not select.
