name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Reports may be written in English or Japanese. 英語または日本語で投稿できます。
        Do not include vulnerabilities or secrets; use the private route in SECURITY.md.
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe the expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide the smallest safe steps or repository that reproduces the problem.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: YAAP version, OS, and .NET SDK
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostic codes and sanitized logs
      description: Remove absolute paths, credentials, personal data, and confidential binlog content.
